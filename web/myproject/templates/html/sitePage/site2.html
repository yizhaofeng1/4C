<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学术价值</title>
    <link rel="stylesheet" href="{% static 'css/siteBase.css' %}">
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" href="../public/favicon.png" type="image/x-icon">
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
       body{
        background-image: url('{% static "public/bg4.jpg" %}');
         height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            font-family: '华文中宋', sans-serif;
        }

        .page-container {
            flex: 1;
            display: flex;
            height: calc(100vh - 80px);
            padding: 15px;
            gap: 15px;
        }

        .left-panel {
            flex: 2;
            min-width: 200px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 5px;
            background: transparent;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
        }

        .right-panel {
            flex: 1;
            min-width: 300px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 5px;
            background: transparent;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: all 0.3s;
            overflow-y: auto;
            padding: 1rem;
        }

        .page-title {
            text-align: center;
            padding: 10px;
        }

        .page-title h1 {
            color: #FFD700;
            font-size: 2rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }

        .back-btn {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #FFD700;
            font-size: 24px;
            transition: transform 0.3s;
        }

        .back-btn:hover {
            transform: translateX(-5px);
        }

        .map-link {
            position: absolute;
            top: 10px;
            right: 10px;
            background-color: rgba(139, 69, 19, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            text-decoration: none;
            transition: background-color 0.3s ease;
        }

        .map-link:hover {
            background-color: rgba(101, 50, 14, 0.7);
        }

        .left-panel:hover,
        .right-panel:hover {
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
            transform: translateY(-2px);
        }

        /* 可视化容器优化 */
        .three-d-bars {
            height: 100%;
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
        }

        .three-d-bars iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* 链接列表美化 */
        .link-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .link-list li {
            margin-bottom: 1rem;
            padding: 0.8rem;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .link-list li::before {
            content: "»";
            color: #FFD700;
            margin-right: 0.8rem;
            font-weight: bold;
        }

        .link-list a {
            color: rgba(255, 255, 255, 0.9);
            text-decoration: none;
            font-size: 1rem;
            line-height: 1.5;
            display: block;
            position: relative;
            z-index: 1;
            word-break: break-word;
        }

        .link-list li:hover {
            background: rgba(76, 175, 80, 0.1);
            transform: translateX(10px);
        }

        .link-list li:hover::after {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: #FFD700;
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.6);
            border-radius: 4px;
        }

        /* 动态装饰元素 */
        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }

        .deco-element {
            position: absolute;
            width: 120px;
            opacity: 0.1;
            animation: float 3s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <!-- 动态装饰元素 -->
