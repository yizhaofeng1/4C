<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>著作演变</title>
    <link rel="stylesheet" href="{% static 'css/siteBase.css' %}">
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" href="../public/favicon.png" type="image/x-icon">
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
     <style>
        /* 基础重置与全局样式 */
        root {
            --primary-color: white;
            /* 主色调 */
            --accent-color: #FFD700;
            /* 强调色 */
            --text-light: rgba(255, 255, 255, 0.9);
            --text-dark: #2c1801;
            --transition-speed: 0.3s;
        }

        html,
        body {
            height: 100%;
            margin: 0;
            padding: 0;
            font-family: '华文中宋', sans-serif;
        }

        body {
            background-image: url('{% static "public/bg4.jpg" %}');
            min-height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            font-family: '华文中宋', sans-serif;
            overflow-y: visible;
        }

        /* 标题样式 */
        .page-title {
            text-align: center;
            padding: 3rem;
            margin: 2rem;
            position: relative;
            margin-top: 10px;
            color: white;
            font-size: 100rem;
            margin-bottom: 2rem;
            text-shadow: 1px 2px 4px rgba(0, 0, 0, 0.5);
        }

        /* 导航按钮 */
        .back-btn {
            position: fixed;
            top: 0.5rem;
            left: 1rem;
            color: white;
            font-size: 1.8rem;
            transition: transform var(--transition-speed);
            z-index: 100;
        }

        .back-btn:hover {
            transform: translateX(-5px);
        }

        /* 主内容容器 */
        .page-container {
            flex: 1;
            display: flex;
            gap: 1rem;
            padding: 1rem;
            height: 100%;
            margin-top: -80px;
            /* 将主容器向上移动40像素 */
        }


        .left-panel,
        .right-panel {
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            background: transparent;
            backdrop-filter: blur(1px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: all var(--transition-speed);
        }

        .left-panel:hover,
        .right-panel:hover {
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
            transform: translateY(-2px);
        }

        /* 左面板 */
        .left-panel {
            flex: 1;
        }

        /* 右面板 */
        .right-panel {
            flex: 1;
        }

        /* 可视化容器优化 */
        .three-d-bars {
            height: 100%;
            width: 100%;
        }

         iframe {
            border: none;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div class="page-title">
        <h1>3D视图地理著作数量演化</h1>
    </div>
    <a href="{% url 'index' %}" class="back-btn">
        <i class="fas fa-arrow-left"></i>
    </a>
    <div class="page-container">
        <div class="left-panel">
            <!-- 命名改一下 这个直接套的site2 -->
            <div class="three-d-bars">
                 <iframe src="{% url 'time_varying_map_globe' %}" title="时间变迁地图"></iframe>
            </div>
        </div>

        <div class="right-panel">
            <!-- 命名改一下 这个直接套的site2 -->
           <div class="three-d-bars">
                <iframe src="{% url 'combined_map_globe' %}" title="综合三维地理视图"></iframe>
           </div>
        </div>
    </div>

    
</body>
</html>
