<!DOCTYPE html>
{% load static %}
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>山海经生物查询</title>
    <link href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/index.css' %}">
    <style>
        /* 设置结果展示区域的字体颜色为黑色 */
        #result {
            color: #000;
        }
    </style>
</head>
<body>
    <video autoplay muted loop id="background-video">
        <source src="{% static 'public/background.mp4' %}" type="video/mp4">
    </video>
    <div class="content">
        <!-- 导航栏 -->
        <nav class="navbar navbar-expand-lg navbar-dark">
            <div class="container">
                <a class="navbar-brand" href="#">
                    <img src="{% static 'images/logo.png' %}" alt="Logo" height="200" style="padding-left: 50px;">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="{% url 'index' %}">返回主页</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <!-- 主要内容区域 -->
        <section class="hero-section" id="home">
            <div class="container">
                <h1 class="hero-title">山海经生物查询</h1>
                <input type="text" id="searchInput" class="form-control mb-3" placeholder="输入生物名称（如：祝余）">
                <button class="btn btn-custom" onclick="searchCreature()">搜索</button>
                <div id="result" class="mt-4"></div>
            </div>
        </section>
    </div>
    <script src="https://cdn.bootcdn.net/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/search.js' %}" charset="UTF-8"></script>
</body>
</html>
